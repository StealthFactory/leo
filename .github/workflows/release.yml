name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.release-kind.outputs.stable }}
    steps:
      - name: Check out Leo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release secrets
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is not configured"; exit 1; }
          test -n "$MACOS_SIGN_P12" || { echo "::error::MACOS_SIGN_P12 is not configured"; exit 1; }
          test -n "$MACOS_SIGN_PASSWORD" || { echo "::error::MACOS_SIGN_PASSWORD is not configured"; exit 1; }
          test -n "$MACOS_NOTARY_KEY" || { echo "::error::MACOS_NOTARY_KEY is not configured"; exit 1; }
          test -n "$MACOS_NOTARY_KEY_ID" || { echo "::error::MACOS_NOTARY_KEY_ID is not configured"; exit 1; }
          test -n "$MACOS_NOTARY_ISSUER_ID" || { echo "::error::MACOS_NOTARY_ISSUER_ID is not configured"; exit 1; }

      - name: Determine release kind
        id: release-kind
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: make check

      - name: Publish release and Homebrew cask
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --timeout 30m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  validate-cask:
    name: Validate cask and finish migration
    needs: release
    if: needs.release.outputs.stable == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: StealthFactory/homebrew-leo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Stage published cask
        shell: bash
        run: |
          set -euo pipefail
          tap="leo-release/check"
          brew tap-new "$tap"
          tapdir="$(brew --repository "$tap")"
          mkdir -p "$tapdir/Casks"
          cp homebrew-tap/Casks/leo.rb "$tapdir/Casks/leo.rb"

      - name: Audit and install cask
        shell: bash
        run: |
          set -euo pipefail
          brew audit --cask --strict --online leo-release/check/leo
          brew install --cask leo-release/check/leo

      - name: Smoke test installed binary
        shell: bash
        run: |
          set -euo pipefail
          leo_bin="$(brew --prefix)/bin/leo"
          expected_version="${GITHUB_REF_NAME#v}"
          "$leo_bin" version | grep -F "leo $expected_version"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/leo-config"
          "$leo_bin" store set answer 42
          test "$("$leo_bin" store type answer)" = "number"
          test "$("$leo_bin" store get answer)" = "42"

      - name: Remove legacy source formula
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          if [ ! -f Formula/leo.rb ]; then
            exit 0
          fi
          rm Formula/leo.rb
          rmdir Formula 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy Leo formula"
          git push origin HEAD:main

      - name: Clean up temporary tap
        if: always()
        run: |
          brew uninstall --cask --force leo-release/check/leo >/dev/null 2>&1 || true
          brew untap leo-release/check >/dev/null 2>&1 || true
